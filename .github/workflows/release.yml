# Build a standalone binary for every platform on a version tag, and publish
# them on a GitHub release.
#
# Each target is built on ITS OWN runner rather than cross-compiled from one
# Linux box. Bun can cross-compile, but it downloads a toolchain per target and
# has been seen to fail extracting one — a poor thing to discover at tag time,
# and every platform here has a native runner anyway.
#
# The suite runs on all three desktop platforms first, because most of what this
# tool does is spawn processes, bind ports and open SQLite files, and those are
# exactly the things that differ per platform.
name: release

on:
  push:
    tags: ['v*']
  # Runnable on demand, so the pipeline can be proven without cutting a release.
  workflow_dispatch:

permissions:
  contents: write

env:
  BUN_VERSION: 1.3.14

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile

      - run: bun run lint
      - run: bun run typecheck

      # The live tests need a key and skip without one; everything else must
      # pass on every platform.
      - run: bun test test

      # And the shipped artefact itself: a compiled binary launching a
      # TypeScript handler cannot work by accident, because there is no bun on
      # PATH for it to shell out to.
      - run: bun run build
      - run: bun test test/binary.test.ts

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: excruciate-linux-x64
          - os: ubuntu-24.04-arm
            name: excruciate-linux-arm64
          - os: macos-latest
            name: excruciate-macos-arm64
          - os: macos-15-intel
            name: excruciate-macos-x64
          - os: windows-latest
            name: excruciate-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile

      - run: bun run build -- --name ${{ matrix.name }}

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}
          if-no-files-found: error

  # ONLY on a tag. Without this guard, running the workflow by hand to prove the
  # pipeline reaches this job on `refs/heads/main`, and action-gh-release has no
  # tag to publish against — so the rehearsal fails at the last step and looks
  # like a broken pipeline. Now `workflow_dispatch` proves verify + build (the
  # binaries land as workflow artifacts) and simply skips publishing.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          # Every artifact straight into dist/, without a folder each.
          merge-multiple: true

      # So a download can be checked against something.
      - name: Checksums
        working-directory: dist
        run: |
          chmod +x excruciate-* || true
          sha256sum excruciate-* > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v3.0.2
        with:
          files: |
            dist/excruciate-*
            dist/SHA256SUMS
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
